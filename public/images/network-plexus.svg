<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="plexus-line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="mesh-poly-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.01" />
    </radialGradient>
  </defs>

  <!-- Geometric Polygon Meshes -->
  <polygon points="180,120 320,180 240,310" fill="url(#mesh-poly-grad)" stroke="url(#plexus-line-grad)" stroke-width="0.8" />
  <polygon points="320,180 490,140 410,290" fill="url(#mesh-poly-grad)" stroke="url(#plexus-line-grad)" stroke-width="0.8" />
  <polygon points="240,310 410,290 350,440" fill="url(#mesh-poly-grad)" stroke="url(#plexus-line-grad)" stroke-width="0.8" />
  <polygon points="410,290 580,260 520,410" fill="url(#mesh-poly-grad)" stroke="url(#plexus-line-grad)" stroke-width="0.8" />

  <polygon points="1020,160 1190,110 1130,270" fill="url(#mesh-poly-grad)" stroke="url(#plexus-line-grad)" stroke-width="0.8" />
  <polygon points="1190,110 1360,180 1280,310" fill="url(#mesh-poly-grad)" stroke="url(#plexus-line-grad)" stroke-width="0.8" />
  <polygon points="1130,270 1280,310 1210,460" fill="url(#mesh-poly-grad)" stroke="url(#plexus-line-grad)" stroke-width="0.8" />
  <polygon points="1280,310 1440,290 1390,440" fill="url(#mesh-poly-grad)" stroke="url(#plexus-line-grad)" stroke-width="0.8" />

