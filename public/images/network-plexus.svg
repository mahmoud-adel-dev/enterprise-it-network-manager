  <circle cx="1020" cy="160" r="4.5" fill="#6366f1" />
  <circle cx="1190" cy="110" r="5.5" fill="#0ea5e9" />
  <circle cx="1190" cy="110" r="10" stroke="#0ea5e9" stroke-width="1" opacity="0.4" />
  <circle cx="1360" cy="180" r="4" fill="#6366f1" />
