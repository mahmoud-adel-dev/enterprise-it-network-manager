<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="epm-gradient-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="epm-gradient-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="epm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#epm-gradient-bg)" />
  <rect x="4" y="4" width="56" height="56" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Inner Cyber Grid Network Shape -->
  <!-- Top Node -->
  <circle cx="32" cy="18" r="4.5" fill="#ffffff" filter="url(#epm-glow)" />
  <!-- Bottom Left Node -->
  <circle cx="19" cy="42" r="4.5" fill="#ffffff" filter="url(#epm-glow)" />
  <!-- Bottom Right Node -->
  <circle cx="45" cy="42" r="4.5" fill="#ffffff" filter="url(#epm-glow)" />

  <!-- Core Center Hub -->
  <circle cx="32" cy="33" r="6.5" fill="url(#epm-gradient-accent)" stroke="#ffffff" stroke-width="2" filter="url(#epm-glow)" />
  <circle cx="32" cy="33" r="2.5" fill="#ffffff" />

  <!-- Interconnecting Circuit / Optical Bus Lines -->
  <path d="M32 22.5 L32 26.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M22.5 39.5 L27 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M41.5 39.5 L37 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M23.5 42 L40.5 42" stroke="rgba(255,255,255,0.7)" stroke-width="1.75" stroke-dasharray="2 2" stroke-linecap="round" />

  <!-- Pulse Status Indicator on Top Right Corner -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981" />
  <circle cx="50" cy="14" r="5" stroke="#10b981" stroke-width="1" opacity="0.6" />
</svg>
